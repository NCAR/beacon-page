# GridStat: NCEP GFS 0.25 degree global forecast grids (pgrb2)
#      vs NCEP URMA 2.5 km CONUS surface analysis
# Generated by beacon_metadata.metplus from datasets/gfs-0p25.yaml and
# datasets/urma-2p5.yaml. Don't edit; regenerate.
#
# Run with:
#   run_metplus.py GridStat.conf config.VALID_BEG=YYYYMMDDHH config.VALID_END=YYYYMMDDHH \
#       config.INPUT_BASE=<staged inputs> config.OUTPUT_BASE=<output dir>
#
# Data:
#   pgrb2_anl: forecast downloaded, reference downloaded
#   pgrb2_pcp_06h: forecast downloaded, reference downloaded

[config]
USE_CASE_DESC = gfs-0p25__urma-2p5
LOG_LEVEL = INFO

PROCESS_LIST = GridStat(pgrb2_anl), GridStat(pgrb2_pcp_06h)

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_INCREMENT = 6H
LEAD_SEQ = 6, 12, 18, 24

GRID_STAT_ONCE_PER_FIELD = False
GRID_STAT_CONFIG_FILE = {PARM_BASE}/met_config/GridStatConfig_wrapped
GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/grid_stat/gfs-0p25__urma-2p5

MODEL = gfs-0p25
OBTYPE = urma-2p5
# beacon-gui reads the reference (observation source) from DESC.
GRID_STAT_DESC = urma-2p5

# Compare on the forecast grid, with the reference averaged onto it,
# wherever the reference has data.
GRID_STAT_REGRID_TO_GRID = FCST
GRID_STAT_REGRID_METHOD = AW_MEAN
GRID_STAT_REGRID_WIDTH = 1
GRID_STAT_MASK_GRID = FULL
GRID_STAT_MASK_POLY =

# Partial sums and event counts are what beacon-gui aggregates; no NetCDF pairs.
GRID_STAT_OUTPUT_FLAG_SL1L2 = STAT
GRID_STAT_OUTPUT_FLAG_CNT = STAT
GRID_STAT_OUTPUT_FLAG_VL1L2 = STAT
GRID_STAT_OUTPUT_FLAG_VCNT = STAT
GRID_STAT_OUTPUT_FLAG_CTC = STAT
GRID_STAT_OUTPUT_FLAG_CTS = STAT
GRID_STAT_NC_PAIRS_FLAG_LATLON = FALSE
GRID_STAT_NC_PAIRS_FLAG_RAW = FALSE
GRID_STAT_NC_PAIRS_FLAG_DIFF = FALSE
GRID_STAT_NC_PAIRS_FLAG_CLIMO = FALSE
GRID_STAT_NC_PAIRS_FLAG_CLIMO_CDP = FALSE
GRID_STAT_NC_PAIRS_FLAG_WEIGHT = FALSE
GRID_STAT_NC_PAIRS_FLAG_NBRHD = FALSE
GRID_STAT_NC_PAIRS_FLAG_FOURIER = FALSE
GRID_STAT_NC_PAIRS_FLAG_GRADIENT = FALSE
GRID_STAT_NC_PAIRS_FLAG_DISTANCE_MAP = FALSE
GRID_STAT_NC_PAIRS_FLAG_APPLY_MASK = FALSE

[pgrb2_anl]
FCST_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/gfs-0p25/pgrb2/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
OBS_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/urma-2p5/anl/{valid?fmt=%Y%m%d%H}.grib2
GRID_STAT_OUTPUT_PREFIX = {MODEL}_pgrb2_anl
FCST_GRID_STAT_VAR1_NAME = TMP
FCST_GRID_STAT_VAR1_LEVELS = Z2
OBS_GRID_STAT_VAR1_NAME = TMP
OBS_GRID_STAT_VAR1_LEVELS = Z2
FCST_GRID_STAT_VAR2_NAME = DPT
FCST_GRID_STAT_VAR2_LEVELS = Z2
OBS_GRID_STAT_VAR2_NAME = DPT
OBS_GRID_STAT_VAR2_LEVELS = Z2
FCST_GRID_STAT_VAR3_NAME = SPFH
FCST_GRID_STAT_VAR3_LEVELS = Z2
OBS_GRID_STAT_VAR3_NAME = SPFH
OBS_GRID_STAT_VAR3_LEVELS = Z2
FCST_GRID_STAT_VAR4_NAME = UGRD
FCST_GRID_STAT_VAR4_LEVELS = Z10
OBS_GRID_STAT_VAR4_NAME = UGRD
OBS_GRID_STAT_VAR4_LEVELS = Z10
FCST_GRID_STAT_VAR5_NAME = VGRD
FCST_GRID_STAT_VAR5_LEVELS = Z10
OBS_GRID_STAT_VAR5_NAME = VGRD
OBS_GRID_STAT_VAR5_LEVELS = Z10
FCST_GRID_STAT_VAR6_NAME = PRES
FCST_GRID_STAT_VAR6_LEVELS = Z0
OBS_GRID_STAT_VAR6_NAME = PRES
OBS_GRID_STAT_VAR6_LEVELS = Z0

[pgrb2_pcp_06h]
FCST_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/gfs-0p25/pgrb2/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
OBS_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/urma-2p5/pcp_06h/{valid?fmt=%Y%m%d%H}.grib2
GRID_STAT_OUTPUT_PREFIX = {MODEL}_pgrb2_pcp_06h
GRID_STAT_REGRID_METHOD = BUDGET
FCST_GRID_STAT_VAR1_NAME = APCP
FCST_GRID_STAT_VAR1_LEVELS = A06
FCST_GRID_STAT_VAR1_THRESH = >0, >=0.254, >=2.54, >=12.7, >=25.4
OBS_GRID_STAT_VAR1_NAME = APCP
OBS_GRID_STAT_VAR1_LEVELS = A06
OBS_GRID_STAT_VAR1_THRESH = >0, >=0.254, >=2.54, >=12.7, >=25.4
