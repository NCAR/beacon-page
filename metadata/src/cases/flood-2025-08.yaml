schema_version: 0.2.0
id: flood-2025-08
title: "Extreme rainfall and urban flooding: 9-10 August 2025 Milwaukee"
short_name: "Flood: Aug 2025 Milwaukee"
summary: >-
  Compare two AI models (GraphCast-GFS and ECMWF AIFS) with two physics
  models (GFS and HRRR) for the 6-hour rainfall of the 9-10 August 2025
  Milwaukee flood, against two rainfall analyses (Stage IV and URMA).
  Several rounds of thunderstorms dropped 1 to 3 inches an hour for several
  hours, mostly between 6 pm on the 9th and 3 am on the 10th. A rain gauge
  on James Madison High School in northwest Milwaukee measured 14.55 inches
  in 21 hours, a new 24-hour record for Wisconsin. The Kinnickinnic,
  Milwaukee, Menomonee and Root rivers reached record levels, and Milwaukee
  County declared a state of emergency. BEACON scores where and how much
  each model put the heavy rain, at leads out to 5 days, and maps it
  against the analyses.
source: >-
  BEACON Steering Committee pilot "Extreme rainfall / urban flooding"
  (2026-11-13), which asks for several models and several observations.
  Event facts from NWS Milwaukee/Sullivan ("New Wisconsin state
  precipitation record"), the UW-Madison Nelson Institute ("Historic
  flooding in southeast Wisconsin: August 9 to 10, 2025") and the AP
  (11 August 2025), checked 2026-11-20
forecasts: [graphcastgfs, aifs-single, gfs-0p25, hrrr]
profile: severe
# Runs every 6 h: the global models out to 120 h (5 days), HRRR to 48 h.
leads: {start: 6, end: 120, step: 6, per_forecast: true}

# The rain fell from late afternoon on the 9th (CDT) to early afternoon on the
# 10th; the 6-hour totals ending 00, 06 and 12 UTC on the 10th hold most of it.
window: {start: 2025-08-09T12:00Z, end: 2025-08-10T18:00Z}

regions:
  - name: MKE
    display: Milwaukee metro (Milwaukee, Waukesha, Ozaukee and Washington counties)
    box: {lat: [42.84, 43.54], lon: [-88.55, -87.8]}

# Rainfall is scored on a 0.05-degree box over southeast Wisconsin and
# northeast Illinois, against Stage IV (the maps) and URMA (scores too).
gridded:
  reference: [stage-iv, urma-2p5]
  step: 6
  grid: {lat: [41.6, 44.4], lon: [-90.4, -86.6], spacing: 0.05}
  display: Southeast Wisconsin map box
  fields:
    - quantity: precipitation_amount
      level: {type: surface}
      statistic: {method: sum, period: PT6H}
      thresholds:
        - {met: ">=12.7", label: "0.5 in"}
        - {met: ">=25.4", label: "1 in"}
        - {met: ">=50.8", label: "2 in"}
        - {met: ">=76.2", label: "3 in"}
      why: >-
        6-hour totals. Inches in a few hours overwhelm city drainage: the
        flooding came from rain rates of 1 to 3 inches an hour.
  danger:
    - {quantity: precipitation_amount, level: {type: surface}, statistic: {method: sum, period: PT6H},
       met: ">=50.8", label: "2 in in 6 h"}
  danger_name: Heavy rain

not_yet:
  - item: Hourly rain rates
    why: >-
      The flooding came from 1 to 3 inches an hour, but only HRRR forecasts
      hourly totals, so every model is compared on 6-hour totals.
  - item: Event report
    why: >-
      Onset and warning lead time at places in the city, as the fire-weather
      case reports at stations. The station observations BEACON uses (GDAS)
      have no rainfall; this needs the analyses read at points instead.
  - item: Neighborhood scores
    why: >-
      A 3 km model that puts a storm a few kilometres off misses it point by
      point. Fractions skill scores (Grid-Stat's neighborhood output) allow
      for that, but the GUI doesn't show them yet.
  - item: Independent observations
    why: >-
      URMA's rainfall is built from the River Forecast Centers' analyses that
      also make up Stage IV, so the two share most of their inputs. MRMS
      radar estimates, rain gauges (CoCoRaHS) and satellite estimates
      (CMORPH) would add independent observations.

notes: >-
  GFS and GraphCast-GFS start from the same GDAS analysis, so they compare a
  physics model with an AI model from one starting point. GFS and
  GraphCast-GFS write 6-hour totals; HRRR and AIFS write totals since the
  run started, so MET PCPCombine subtracts the total 6 hours earlier. Every
  model and both analyses are put on the box by MET's budget method, which
  keeps rainfall totals. The maps' heavy-rain area is 6-hour rain of at
  least 2 inches. Most of the box is outside the city, so the MKE region
  scores the metro area alone.
