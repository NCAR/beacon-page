schema_version: 0.2.0
id: gdas-prepbufr
title: NCEP GDAS PREPBUFR global surface and upper-air observations
short_name: GDAS
description: >-
  Quality-controlled observations prepared for the GDAS analysis. beacon-vx
  converts them with MET pb2nc; variable names below are the ones pb2nc
  writes and Point-Stat reads.
kind: observation
producer: NOAA/NWS/NCEP
identifiers:
  - {scheme: gdex, value: d337000}
  - {scheme: doi, value: 10.5065/Z83F-N512}
format: prepbufr

spatial:
  type: points
  bbox: [-180, -90, 180, 90]

time:
  coverage: {start: 1997-04-30T00:00Z, end: null}
  frequency: PT6H

locations:
  - id: gdex-glade
    provider: gdex
    access: posix
    retention: permanent
    coverage: {start: 2009-01-01T00:00Z}
    files:
      prepbufr:
        template: "/glade/campaign/collections/gdex/data/d337000/prepnr/{valid?fmt=%Y}/prepbufr.gdas.{valid?fmt=%Y%m%d%H}.nr"
    notes: Files from 1997 to 2008 use other names (e.g. prepbufr.gdas.2008010100.wo40.nr).
  - id: gdex-https
    provider: gdex
    access: https
    retention: permanent
    coverage: {start: 2009-01-01T00:00Z}
    files:
      prepbufr:
        template: "https://data.gdex.ucar.edu/d337000/prepnr/{valid?fmt=%Y}/prepbufr.gdas.{valid?fmt=%Y%m%d%H}.nr"
  - id: nomads
    provider: nomads
    access: https
    retention: P2D
    files:
      prepbufr:
        template: "https://nomads.ncep.noaa.gov/pub/data/nccf/com/obsproc/prod/gdas.{valid?fmt=%Y%m%d}/gdas.t{valid?fmt=%H}z.prepbufr.nr"

variables:
  - {quantity: air_temperature, level: {type: height_above_ground, value: 2}, native: {name: TMP}}
  - {quantity: dew_point_temperature, level: {type: height_above_ground, value: 2}, native: {name: DPT}}
  - {quantity: specific_humidity, level: {type: height_above_ground, value: 2}, native: {name: SPFH}}
  - {quantity: relative_humidity, level: {type: height_above_ground, value: 2}, native: {name: RH}}
  - {quantity: eastward_wind, level: {type: height_above_ground, value: 10}, native: {name: UGRD}}
  - {quantity: northward_wind, level: {type: height_above_ground, value: 10}, native: {name: VGRD}}
  - {quantity: wind_speed, level: {type: height_above_ground, value: 10}, native: {name: WIND}}
  - {quantity: air_pressure_at_mean_sea_level, level: {type: mean_sea_level}, native: {name: PRMSL}}
  - quantity: geopotential_height
    level: {type: isobaric, values: [50, 100, 150, 200, 250, 300, 400, 500, 700, 850, 925, 1000]}
    native: {name: HGT, units: gpm}
  - quantity: air_temperature
    level: {type: isobaric, values: [50, 100, 150, 200, 250, 300, 400, 500, 700, 850, 925, 1000]}
    native: {name: TMP}
  - quantity: eastward_wind
    level: {type: isobaric, values: [50, 100, 150, 200, 250, 300, 400, 500, 700, 850, 925, 1000]}
    native: {name: UGRD}
  - quantity: northward_wind
    level: {type: isobaric, values: [50, 100, 150, 200, 250, 300, 400, 500, 700, 850, 925, 1000]}
    native: {name: VGRD}
  - quantity: specific_humidity
    level: {type: isobaric, values: [50, 100, 150, 200, 250, 300, 400, 500, 700, 850, 925, 1000]}
    native: {name: SPFH}

quality:
  flag: unknown
  observation_qc:
    scheme: >-
      NCEP PREPBUFR quality markers per observation (0 keep, 1 good,
      2 neutral, 3 suspect, higher values flagged or rejected).
    beacon_setting: PB2NC_QUALITY_MARK_THRESH = 9 (src/beacon-vx/parm/PB2NC_obsGDAS.conf)
    notes: MET's default threshold is 2. Confirm which quality markers BEACON intends to accept.

notes: >-
  Surface reports are matched at MET levels Z2 and Z10. Upper-air levels
  listed are the mandatory radiosonde levels.
