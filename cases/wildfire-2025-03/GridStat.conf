# Grid-Stat for the "Wildfire, utilities and insurance: 14 March 2025 Southern Plains outbreak" use case
# Generated by beacon_metadata.metplus from cases/wildfire-2025-03.yaml and the
# dataset records. Don't edit; regenerate.
#
# Run with:
#   run_metplus GridStat.conf config.VALID_BEG=YYYYMMDDHH config.VALID_END=YYYYMMDDHH \
#       config.INPUT_BASE=<staged inputs> config.OUTPUT_BASE=<output dir>
#
# Every forecast and the URMA analysis on one box, 26 to 40.5 N and
# -107 to -94 E every 0.1 degrees, every 6 hours: scores
# for the whole box (FULL) and each polyline region, and the matched fields for
# the GUI's Fields page.

[config]
USE_CASE_DESC = wildfire-2025-03_gridded
LOG_LEVEL = INFO

PROCESS_LIST = GridStat(aifs_single_fc), GridStat(hrrr_wrfsfc)

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_INCREMENT = 6H
# Each forecast's leads are in its own section.

GRID_STAT_ONCE_PER_FIELD = False
GRID_STAT_CONFIG_FILE = {PARM_BASE}/met_config/GridStatConfig_wrapped
OBS_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/urma-2p5/anl/{valid?fmt=%Y%m%d%H}.grib2
GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/grid_stat
GRID_STAT_OUTPUT_PREFIX = {MODEL}
OBTYPE = urma-2p5
# beacon-gui reads the reference (observation source) from DESC.
GRID_STAT_DESC = urma-2p5

GRID_STAT_REGRID_TO_GRID = latlon 131 146 26 -107 0.1 0.1
# Forecasts and analyses both interpolated to the box.
GRID_STAT_REGRID_METHOD = BILIN
GRID_STAT_REGRID_WIDTH = 2
GRID_STAT_MASK_GRID = FULL
GRID_STAT_MASK_POLY = {MET_INSTALL_DIR}/share/met/poly/SPL.poly

GRID_STAT_OUTPUT_FLAG_SL1L2 = STAT
GRID_STAT_OUTPUT_FLAG_CNT = STAT
GRID_STAT_OUTPUT_FLAG_VL1L2 = NONE
GRID_STAT_OUTPUT_FLAG_VCNT = NONE
GRID_STAT_OUTPUT_FLAG_CTC = STAT
GRID_STAT_OUTPUT_FLAG_CTS = STAT
GRID_STAT_NC_PAIRS_FLAG_LATLON = TRUE
GRID_STAT_NC_PAIRS_FLAG_RAW = TRUE
GRID_STAT_NC_PAIRS_FLAG_DIFF = TRUE
GRID_STAT_NC_PAIRS_FLAG_CLIMO = FALSE
GRID_STAT_NC_PAIRS_FLAG_CLIMO_CDP = FALSE
GRID_STAT_NC_PAIRS_FLAG_WEIGHT = FALSE
GRID_STAT_NC_PAIRS_FLAG_NBRHD = FALSE
GRID_STAT_NC_PAIRS_FLAG_FOURIER = FALSE
GRID_STAT_NC_PAIRS_FLAG_GRADIENT = FALSE
GRID_STAT_NC_PAIRS_FLAG_DISTANCE_MAP = FALSE
GRID_STAT_NC_PAIRS_FLAG_APPLY_MASK = FALSE

[aifs_single_fc]
MODEL = aifs-single
FCST_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/aifs-single/fc/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
VALID_INCREMENT = 6H
LEAD_SEQ = 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192, 198, 204, 210, 216, 222, 228, 234, 240
# FCST WIND isn't in the files; derived by MET.
FCST_GRID_STAT_VAR1_NAME = WIND
FCST_GRID_STAT_VAR1_LEVELS = Z10
FCST_GRID_STAT_VAR1_THRESH = >=8.9, >=11.2, >=13.4
OBS_GRID_STAT_VAR1_NAME = WIND
OBS_GRID_STAT_VAR1_LEVELS = Z10
OBS_GRID_STAT_VAR1_THRESH = >=8.9, >=11.2, >=13.4
# FCST RH isn't in the files; derived by BEACON, after download.
# OBS RH isn't in the files; derived by BEACON, after download.
FCST_GRID_STAT_VAR2_NAME = RH
FCST_GRID_STAT_VAR2_LEVELS = Z2
FCST_GRID_STAT_VAR2_THRESH = <=15
OBS_GRID_STAT_VAR2_NAME = RH
OBS_GRID_STAT_VAR2_LEVELS = Z2
OBS_GRID_STAT_VAR2_THRESH = <=15
FCST_GRID_STAT_VAR3_NAME = TMP
FCST_GRID_STAT_VAR3_LEVELS = Z2
OBS_GRID_STAT_VAR3_NAME = TMP
OBS_GRID_STAT_VAR3_LEVELS = Z2

[hrrr_wrfsfc]
MODEL = hrrr
FCST_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/hrrr/wrfsfc/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
VALID_INCREMENT = 6H
LEAD_SEQ = 6, 12, 18, 24, 30, 36, 42, 48
# FCST WIND isn't in the files; derived by MET.
FCST_GRID_STAT_VAR1_NAME = WIND
FCST_GRID_STAT_VAR1_LEVELS = Z10
FCST_GRID_STAT_VAR1_THRESH = >=8.9, >=11.2, >=13.4
OBS_GRID_STAT_VAR1_NAME = WIND
OBS_GRID_STAT_VAR1_LEVELS = Z10
OBS_GRID_STAT_VAR1_THRESH = >=8.9, >=11.2, >=13.4
# OBS RH isn't in the files; derived by BEACON, after download.
FCST_GRID_STAT_VAR2_NAME = RH
FCST_GRID_STAT_VAR2_LEVELS = Z2
FCST_GRID_STAT_VAR2_THRESH = <=15
OBS_GRID_STAT_VAR2_NAME = RH
OBS_GRID_STAT_VAR2_LEVELS = Z2
OBS_GRID_STAT_VAR2_THRESH = <=15
FCST_GRID_STAT_VAR3_NAME = TMP
FCST_GRID_STAT_VAR3_LEVELS = Z2
OBS_GRID_STAT_VAR3_NAME = TMP
OBS_GRID_STAT_VAR3_LEVELS = Z2
