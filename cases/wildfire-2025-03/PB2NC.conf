# PB2NC for the "Wildfire, utilities and insurance: 14 March 2025 Southern Plains outbreak" use case
# Generated by beacon_metadata.metplus from cases/wildfire-2025-03.yaml and the
# dataset records. Don't edit; regenerate.
#
# Run with:
#   run_metplus PB2NC.conf config.VALID_BEG=YYYYMMDDHH config.VALID_END=YYYYMMDDHH \
#       config.INPUT_BASE=<staged inputs> config.OUTPUT_BASE=<output dir>

[config]
USE_CASE_DESC = wildfire-2025-03_observations
LOG_LEVEL = INFO

PROCESS_LIST = PB2NC

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_INCREMENT = 6H
LEAD_SEQ = 0

PB2NC_INPUT_TEMPLATE = {INPUT_BASE}/gdas-prepbufr/prepbufr/{valid?fmt=%Y%m%d%H}.prepbufr
PB2NC_OUTPUT_TEMPLATE = {OUTPUT_BASE}/pb2nc/{valid?fmt=%Y%m%d%H}.nc
PB2NC_SKIP_IF_OUTPUT_EXISTS = True
PB2NC_MESSAGE_TYPE = ADPSFC
PB2NC_MASK_POLY = {MET_INSTALL_DIR}/share/met/poly/CONUS.poly

# Keep every report in each file: Point-Stat scores every 1 h from
# files every 6 h (see beacon_metadata.metplus.obs_timing).
OBS_PB2NC_WINDOW_BEGIN = -10800
OBS_PB2NC_WINDOW_END = 10800
PB2NC_QUALITY_MARK_THRESH = 9
PB2NC_OBS_BUFR_VAR_LIST = QOB, TOB, ZOB, UOB, VOB, POB, D_DPT, D_WDIR, D_WIND, D_RH, D_MIXR, D_PRMSL
PB2NC_TIME_SUMMARY_FLAG = False
