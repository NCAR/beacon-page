# Grid-Stat for the "Extreme rainfall and urban flooding: 9-10 August 2025 Milwaukee" use case
# Generated by beacon_metadata.metplus from cases/flood-2025-08.yaml and the
# dataset records. Don't edit; regenerate.
#
# Run with:
#   run_metplus GridStat.conf config.VALID_BEG=YYYYMMDDHH config.VALID_END=YYYYMMDDHH \
#       config.INPUT_BASE=<staged inputs> config.OUTPUT_BASE=<output dir>
#
# Every forecast and the Stage IV and URMA analyses on one box, 41.6 to 44.4 N and
# -90.4 to -86.6 E every 0.05 degrees, every 6 hours: scores
# for the whole box (FULL) and each polyline region, and the matched fields for
# the GUI's Fields page.
#
# PCPCombine first works out amounts for forecasts that have only run totals.

[config]
USE_CASE_DESC = flood-2025-08_gridded
LOG_LEVEL = INFO

PROCESS_LIST = PCPCombine(pcp_aifs_single_fc_TPRATE_A06), PCPCombine(pcp_hrrr_wrfsfc_APCP_A06), GridStat(graphcastgfs_pgrb2), GridStat(graphcastgfs_pgrb2_urma_2p5), GridStat(aifs_single_fc_TPRATE_A06), GridStat(aifs_single_fc_TPRATE_A06_urma_2p5), GridStat(gfs_0p25_pgrb2), GridStat(gfs_0p25_pgrb2_urma_2p5), GridStat(hrrr_wrfsfc_APCP_A06), GridStat(hrrr_wrfsfc_APCP_A06_urma_2p5)

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_INCREMENT = 6H
# Each forecast's leads are in its own section.

GRID_STAT_ONCE_PER_FIELD = False
GRID_STAT_CONFIG_FILE = {PARM_BASE}/met_config/GridStatConfig_wrapped
OBS_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/stage-iv/st4_06h/{valid?fmt=%Y%m%d%H}.grib2
GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/grid_stat
GRID_STAT_OUTPUT_PREFIX = {MODEL}
OBTYPE = stage-iv
# beacon-gui reads the reference (observation source) from DESC.
GRID_STAT_DESC = stage-iv

GRID_STAT_REGRID_TO_GRID = latlon 77 57 41.6 -90.4 0.05 0.05
# Forecasts and analyses both put on the box by MET's budget method, which
# keeps precipitation totals.
GRID_STAT_REGRID_METHOD = BUDGET
GRID_STAT_REGRID_WIDTH = 2
GRID_STAT_MASK_GRID = FULL
GRID_STAT_MASK_POLY = {OUTPUT_BASE}/masks/MKE.poly

GRID_STAT_OUTPUT_FLAG_SL1L2 = STAT
GRID_STAT_OUTPUT_FLAG_CNT = STAT
GRID_STAT_OUTPUT_FLAG_VL1L2 = NONE
GRID_STAT_OUTPUT_FLAG_VCNT = NONE
GRID_STAT_OUTPUT_FLAG_CTC = STAT
GRID_STAT_OUTPUT_FLAG_CTS = STAT
GRID_STAT_NC_PAIRS_FLAG_LATLON = TRUE
GRID_STAT_NC_PAIRS_FLAG_RAW = TRUE
GRID_STAT_NC_PAIRS_FLAG_DIFF = TRUE
GRID_STAT_NC_PAIRS_FLAG_CLIMO = FALSE
GRID_STAT_NC_PAIRS_FLAG_CLIMO_CDP = FALSE
GRID_STAT_NC_PAIRS_FLAG_WEIGHT = FALSE
GRID_STAT_NC_PAIRS_FLAG_NBRHD = FALSE
GRID_STAT_NC_PAIRS_FLAG_FOURIER = FALSE
GRID_STAT_NC_PAIRS_FLAG_GRADIENT = FALSE
GRID_STAT_NC_PAIRS_FLAG_DISTANCE_MAP = FALSE
GRID_STAT_NC_PAIRS_FLAG_APPLY_MASK = FALSE

[pcp_aifs_single_fc_TPRATE_A06]
MODEL = aifs-single
VALID_INCREMENT = 6H
LEAD_SEQ = 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120
FCST_PCP_COMBINE_RUN = True
OBS_PCP_COMBINE_RUN = False
# The run total minus the run total hours earlier; at that lead itself, the
# run total alone (METplus reads it with -add).
FCST_PCP_COMBINE_METHOD = SUBTRACT
FCST_PCP_COMBINE_INPUT_TEMPLATE = {INPUT_BASE}/aifs-single/fc/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
FCST_PCP_COMBINE_INPUT_NAMES = TPRATE
# A run total's level is its lead: A12 in the 12 h file (METplus fills in each file's lead).
FCST_PCP_COMBINE_INPUT_LEVELS = A{lead?fmt=%H}
FCST_PCP_COMBINE_OUTPUT_ACCUM = 6H
FCST_PCP_COMBINE_OUTPUT_NAME = APCP
FCST_PCP_COMBINE_OUTPUT_TEMPLATE = {OUTPUT_BASE}/pcp_combine/aifs-single/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}_TPRATE_A06.nc

[pcp_hrrr_wrfsfc_APCP_A06]
MODEL = hrrr
VALID_INCREMENT = 6H
LEAD_SEQ = 6, 12, 18, 24, 30, 36, 42, 48
FCST_PCP_COMBINE_RUN = True
OBS_PCP_COMBINE_RUN = False
# The run total minus the run total hours earlier; at that lead itself, the
# run total alone (METplus reads it with -add).
FCST_PCP_COMBINE_METHOD = SUBTRACT
FCST_PCP_COMBINE_INPUT_TEMPLATE = {INPUT_BASE}/hrrr/wrfsfc/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
FCST_PCP_COMBINE_INPUT_NAMES = APCP
# A run total's level is its lead: A12 in the 12 h file (METplus fills in each file's lead).
FCST_PCP_COMBINE_INPUT_LEVELS = A{lead?fmt=%H}
FCST_PCP_COMBINE_OUTPUT_ACCUM = 6H
FCST_PCP_COMBINE_OUTPUT_NAME = APCP
FCST_PCP_COMBINE_OUTPUT_TEMPLATE = {OUTPUT_BASE}/pcp_combine/hrrr/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}_APCP_A06.nc

[graphcastgfs_pgrb2]
MODEL = graphcastgfs
FCST_GRID_STAT_INPUT_TEMPLATE = {INPUT_BASE}/graphcastgfs/pgrb2/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
VALID_INCREMENT = 6H
LEAD_SEQ = 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120
FCST_GRID_STAT_VAR1_NAME = APCP
FCST_GRID_STAT_VAR1_LEVELS = A06
FCST_GRID_STAT_VAR1_THRESH = >=12.7, >=25.4, >=50.8, >=76.2
OBS_GRID_STAT_VAR1_NAME = APCP
OBS_GRID_STAT_VAR1_LEVELS = A06
OBS_GRID_STAT_VAR1_THRESH = >=12.7, >=25.4, >=50.8, >=76.2

