# Point-Stat for the "Extreme heat" use case
# Generated by beacon_metadata.metplus from cases/heat.yaml and the
# dataset records. Don't edit; regenerate.
#
# Run with:
#   run_metplus PointStat.conf config.VALID_BEG=YYYYMMDDHH config.VALID_END=YYYYMMDDHH \
#       config.INPUT_BASE=<staged inputs> config.OUTPUT_BASE=<output dir>
#
# Every forecast is interpolated to the same stations, so models on different
# grids are compared the same way.

[config]
USE_CASE_DESC = heat
LOG_LEVEL = INFO

PROCESS_LIST = PointStat(aifs_single_fc), PointStat(hrrr_wrfsfc)

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_INCREMENT = 6H
LEAD_SEQ = 6, 12, 18, 24, 30, 36, 42, 48

POINT_STAT_ONCE_PER_FIELD = False
POINT_STAT_CONFIG_FILE = {PARM_BASE}/met_config/PointStatConfig_wrapped
OBS_POINT_STAT_INPUT_TEMPLATE = {OUTPUT_BASE}/pb2nc/{valid?fmt=%Y%m%d%H}.nc
POINT_STAT_OUTPUT_DIR = {OUTPUT_BASE}/point_stat
POINT_STAT_OUTPUT_PREFIX = {MODEL}
# beacon-gui reads the reference (observation source) from DESC.
POINT_STAT_DESC = gdas-prepbufr

# Same matching as beacon-vx's surface Point-Stat configs.
POINT_STAT_MESSAGE_TYPE = ADPSFC
OBS_POINT_STAT_WINDOW_BEGIN = -1800
OBS_POINT_STAT_WINDOW_END = 1800
POINT_STAT_OBS_QUALITY_INC = 1, 2, 9
POINT_STAT_INTERP_TYPE_METHOD = BILIN
POINT_STAT_INTERP_TYPE_WIDTH = 2

POINT_STAT_MASK_GRID =
POINT_STAT_MASK_POLY = {MET_INSTALL_DIR}/share/met/poly/CONUS.poly, {MET_INSTALL_DIR}/share/met/poly/SWD.poly, {MET_INSTALL_DIR}/share/met/poly/SPL.poly, {MET_INSTALL_DIR}/share/met/poly/SEC.poly
POINT_STAT_MASK_SID = 

POINT_STAT_OUTPUT_FLAG_SL1L2 = STAT
POINT_STAT_OUTPUT_FLAG_CNT = STAT
POINT_STAT_OUTPUT_FLAG_VL1L2 = STAT
POINT_STAT_OUTPUT_FLAG_VCNT = STAT
POINT_STAT_OUTPUT_FLAG_CTC = STAT
POINT_STAT_OUTPUT_FLAG_CTS = STAT
POINT_STAT_OUTPUT_FLAG_MPR = NONE

[aifs_single_fc]
MODEL = aifs-single
FCST_POINT_STAT_INPUT_TEMPLATE = {INPUT_BASE}/aifs-single/fc/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
FCST_POINT_STAT_VAR1_NAME = TMP
FCST_POINT_STAT_VAR1_LEVELS = Z2
FCST_POINT_STAT_VAR1_THRESH = >=305.37, >=308.15, >=310.93
OBS_POINT_STAT_VAR1_NAME = TMP
OBS_POINT_STAT_VAR1_LEVELS = Z2
OBS_POINT_STAT_VAR1_THRESH = >=305.37, >=308.15, >=310.93
FCST_POINT_STAT_VAR2_NAME = DPT
FCST_POINT_STAT_VAR2_LEVELS = Z2
OBS_POINT_STAT_VAR2_NAME = DPT
OBS_POINT_STAT_VAR2_LEVELS = Z2
# RH isn't in the files; derived by BEACON, after download.
FCST_POINT_STAT_VAR3_NAME = RH
FCST_POINT_STAT_VAR3_LEVELS = Z2
OBS_POINT_STAT_VAR3_NAME = RH
OBS_POINT_STAT_VAR3_LEVELS = Z2

[hrrr_wrfsfc]
MODEL = hrrr
FCST_POINT_STAT_INPUT_TEMPLATE = {INPUT_BASE}/hrrr/wrfsfc/{init?fmt=%Y%m%d%H}/f{lead?fmt=%3H}.grib2
FCST_POINT_STAT_VAR1_NAME = TMP
FCST_POINT_STAT_VAR1_LEVELS = Z2
FCST_POINT_STAT_VAR1_THRESH = >=305.37, >=308.15, >=310.93
OBS_POINT_STAT_VAR1_NAME = TMP
OBS_POINT_STAT_VAR1_LEVELS = Z2
OBS_POINT_STAT_VAR1_THRESH = >=305.37, >=308.15, >=310.93
FCST_POINT_STAT_VAR2_NAME = DPT
FCST_POINT_STAT_VAR2_LEVELS = Z2
OBS_POINT_STAT_VAR2_NAME = DPT
OBS_POINT_STAT_VAR2_LEVELS = Z2
FCST_POINT_STAT_VAR3_NAME = RH
FCST_POINT_STAT_VAR3_LEVELS = Z2
OBS_POINT_STAT_VAR3_NAME = RH
OBS_POINT_STAT_VAR3_LEVELS = Z2
